<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ barbearia.nome }} - Agendamento</title>
    <link rel="stylesheet" href="../static/style.css">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> -->
    <style>
        /* Variáveis White-label injetadas pelo Python */
        :root {
            --cor-primaria: {{ barbearia.cor_primaria }};
            --cor-secundaria: {{ barbearia.cor_secundaria }};
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-placeholder">{{ barbearia.nome }}</div>
    </header>

    <main class="container">
        <form id="form-agendamento">
            
            <!-- Passo 1: Serviços -->
            <section class="card">
                <h2>1. Escolha o Serviço</h2>
                <div class="opcoes-lista">
                    <label class="opcao-item">
                        <input type="checkbox" name="servico" value="cabelo" data-preco="40.00">
                        Cabelo (R$ 35,00)
                    </label>
                    <label class="opcao-item">
                        <input type="checkbox" name="servico" value="barba" data-preco="35.00">
                        Barba (R$ 15,00)
                    </label>
                    <label class="opcao-item">
                        <input type="checkbox" name="servico" value="sobrancelha" data-preco="15.00">
                        Sobrancelha (R$ 10,00)
                    </label>
                </div>
            </section>

            <!-- Passo 2: Profissional -->
            <section class="card">
                <h2>2. Escolha o Barbeiro</h2>
                <div class="profissionais-lista">
                    <label class="card-profissional">
                        <input type="radio" name="barbeiro" value="1" required>
                        <img src="https://via.placeholder.com/60" alt="Foto do Barbeiro">
                        <span>Cabeleleiro1</span>
                    </label>
                    <label class="card-profissional">
                        <input type="radio" name="barbeiro" value="2">
                        <img src="https://via.placeholder.com/60" alt="Foto do Barbeiro">
                        <span>Cabeleleiro2</span>
                    </label>
                </div>
            </section>

            <!-- Passo 3: Data e Hora -->
            <section class="card">
                <h2>3. Data e Horário</h2>
                <input type="date" id="data" name="data" required>
                <div class="horarios-lista" id="grid-horarios">
                    <!-- Gerado dinamicamente ou populado pelo backend -->
                    <label><input type="radio" name="horario" value="09:00" required> 09:00</label>
                    <label><input type="radio" name="horario" value="09:45"> 09:45</label>
                    <label><input type="radio" name="horario" value="10:30"> 10:30</label>
                </div>
            </section>

            <!-- Passo 4: Seus Dados -->
            <section class="card">
                <h2>4. Seus Dados</h2>
                <input type="text" id="nome" name="nome" placeholder="Seu Nome Completo" required>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="WhatsApp (com DDD)" required>
            </section>

            <!-- Resumo e Confirmação -->
            <div class="resumo-fixo">
                <div class="total-valor">Total: R$ <span id="valor-total">0,00</span></div>
                <button type="submit" class="btn-confirmar">Confirmar Agendamento</button>
            </div>
        </form>
    </main>

    <script>document.addEventListener('DOMContentLoaded', () => {
    const checkboxesServicos = document.querySelectorAll('input[name="servico"]');
    const displayTotal = document.getElementById('valor-total');
    const form = document.getElementById('form-agendamento');

    // Atualiza o valor total em tempo real
    function atualizarTotal() {
        let total = 0;
        checkboxesServicos.forEach(checkbox => {
            if (checkbox.checked) {
                total += parseFloat(checkbox.getAttribute('data-preco'));
            }
        });
        displayTotal.textContent = total.toFixed(2).replace('.', ',');
    }

    checkboxesServicos.forEach(checkbox => {
        checkbox.addEventListener('change', atualizarTotal);
    });

    // Intercepta o formulário para enviar via AJAX/Fetch ao Python
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Verifica se pelo menos um serviço foi selecionado
        const servicosSelecionados = Array.from(checkboxesServicos).filter(c => c.checked);
        if (servicosSelecionados.length === 0) {
            alert('Por favor, selecione pelo menos um serviço.');
            return;
        }

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        data.servicos = servicosSelecionados.map(c => c.value);

        // Disparo para o backend Python
        fetch('/agendar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if(result.status === "success") {
                // Aqui entraria o modal de validação anti-trote (código WhatsApp)
                alert('Tudo certo! Um código de 4 dígitos foi enviado para o seu WhatsApp.');
            }
        })
        .catch(error => {
            console.error('Erro:', error);
            alert('Erro ao processar o agendamento.');
        });
    });
});</script>
    <!-- <script src="{{ url_for('static', filename='script.js') }}"></script> -->
</body>
</html>
